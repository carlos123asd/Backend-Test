# Configuración del servidor de la aplicación
server:
  # Puerto requerido para la prueba técnica
  port: 5000

spring:
  application:
    name: backtest

  # Control del tamaño máximo de los buffers de datos
  # que Spring WebFlux puede manejar en memoria.
  #
  # Importante por:
  # - Seguridad -> evita ataques DoS mediante payloads enormes
  # - Estabilidad -> evita consumo excesivo de RAM
  # - Rendimiento -> favorece procesamiento streaming/reactivo
  #   en lugar de cargar grandes cantidades de datos en memoria
  codec:
    max-in-memory-size: 10MB

# Configuración personalizada para APIs externas
external-api:
  # URL base de los mocks proporcionados por la prueba
  base-url: http://localhost:3001